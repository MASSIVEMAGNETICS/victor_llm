name: PR Checklist

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  checklist:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check PR description
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request;
          const body = pr.body || '';
          
          // Check if PR has description
          if (body.trim().length < 50) {
            core.setFailed('PR description is too short. Please provide a detailed description.');
            return;
          }
          
          // Check for required sections
          const requiredSections = [
            'Description',
            'Type of Change',
            'Testing'
          ];
          
          const missingSections = requiredSections.filter(section => {
            return !body.includes(section);
          });
          
          if (missingSections.length > 0) {
            core.warning(`PR is missing the following sections: ${missingSections.join(', ')}`);
          }
          
          // Check if checkboxes are checked
          const checkboxPattern = /- \[x\]/gi;
          const checkedBoxes = (body.match(checkboxPattern) || []).length;
          
          if (checkedBoxes === 0) {
            core.warning('No checkboxes are checked in the PR description. Please review the checklist.');
          }
          
          core.info(`PR checklist validation completed. ${checkedBoxes} items checked.`);

  size-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Add size label
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request;
          
          // Get the diff
          const { data: files } = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pr.number
          });
          
          // Calculate total changes
          const totalChanges = files.reduce((sum, file) => sum + file.additions + file.deletions, 0);
          
          // Determine size label
          let sizeLabel = 'size/XS';
          if (totalChanges > 1000) {
            sizeLabel = 'size/XXL';
          } else if (totalChanges > 500) {
            sizeLabel = 'size/XL';
          } else if (totalChanges > 200) {
            sizeLabel = 'size/L';
          } else if (totalChanges > 50) {
            sizeLabel = 'size/M';
          } else if (totalChanges > 10) {
            sizeLabel = 'size/S';
          }
          
          // Remove old size labels
          const existingLabels = pr.labels.map(label => label.name);
          const sizeLabels = existingLabels.filter(label => label.startsWith('size/'));
          
          for (const label of sizeLabels) {
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              name: label
            }).catch(() => {}); // Ignore errors if label doesn't exist
          }
          
          // Add new size label
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pr.number,
            labels: [sizeLabel]
          });
          
          core.info(`Added label: ${sizeLabel} (${totalChanges} total changes)`);
